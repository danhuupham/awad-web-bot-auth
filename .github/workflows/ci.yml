name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 26 Active LTS (Lithium)
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install locked devDependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run quality gates (format:check, lint, typecheck, test, scan, verify:claims)
        run: npm run check

      - name: Smoke-test reproducible measurement command (5 runs)
        run: node scripts/measure.js --runs=5
